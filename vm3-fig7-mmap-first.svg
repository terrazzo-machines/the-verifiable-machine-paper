  <text x="60" y="88" font-size="28" font-weight="700" fill="#1A2332">One Binary, Any RAM</text>
  <text x="60" y="112" font-size="13.5" fill="#5A6472">Residency is the OS's business; values are ours (docs/mac-lane.md). Same container, same engine, both hosts.</text>

