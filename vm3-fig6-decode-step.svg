<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1080" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ai6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A2332"/></marker>
    <marker id="at6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7C66"/></marker>
  </defs>
  <rect width="1050" height="1080" fill="#FBFAF7"/>
  <text x="60" y="52" font-size="12" letter-spacing="3" fill="#0E7C66" font-weight="600">FIGURE 6 · ONE DECODE STEP</text>
  <text x="60" y="88" font-size="28" font-weight="700" fill="#1A2332">The Real Math</text>
  <text x="60" y="112" font-size="13.5" fill="#5A6472">forward.c as shipped in pitch 1 — fp32, single-threaded, -ffp-contract=off, Llama-shaped.</text>

  <!-- input -->
  <rect x="400" y="140" width="250" height="38" rx="19" fill="#16324F"/>
  <text x="525" y="164" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">token id t · position pos</text>
  <path d="M525,178 V202" stroke="#1A2332" stroke-width="2" marker-end="url(#ai6)"/>
  <rect x="400" y="206" width="250" height="36" rx="8" fill="#FFFFFF" stroke="#1A2332" stroke-width="1.4"/>
  <text x="525" y="229" font-size="11.5" fill="#1A2332" text-anchor="middle">x = tok_emb[t]   (dim)</text>
  <path d="M525,242 V266" stroke="#1A2332" stroke-width="2" marker-end="url(#ai6)"/>

  <!-- layer block -->
  <rect x="180" y="270" width="690" height="540" rx="14" fill="#F7F6F2" stroke="#1A2332" stroke-width="1.8"/>
  <rect x="205" y="258" width="150" height="24" rx="12" fill="#1A2332"/>
  <text x="280" y="274" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">LAYER  × n_layers</text>

  <rect x="400" y="296" width="250" height="34" rx="8" fill="#FFFFFF" stroke="#1A2332" stroke-width="1.3"/>
  <text x="525" y="318" font-size="11.5" fill="#1A2332" text-anchor="middle">RMSNorm (attn_norm, eps)</text>
  <path d="M525,330 V350" stroke="#1A2332" stroke-width="2" marker-end="url(#ai6)"/>

  <rect x="285" y="354" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#1A2332" stroke-width="1.3"/>
  <text x="360" y="376" font-size="11.5" fill="#1A2332" text-anchor="middle">wq · matvec</text>
  <rect x="450" y="354" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#1A2332" stroke-width="1.3"/>
  <text x="525" y="376" font-size="11.5" fill="#1A2332" text-anchor="middle">wk · matvec</text>
  <rect x="615" y="354" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#1A2332" stroke-width="1.3"/>
  <text x="690" y="376" font-size="11.5" fill="#1A2332" text-anchor="middle">wv · matvec</text>

  <path d="M360,388 V408" stroke="#1A2332" stroke-width="1.8" marker-end="url(#ai6)"/>
  <path d="M525,388 V408" stroke="#1A2332" stroke-width="1.8" marker-end="url(#ai6)"/>
  <rect x="285" y="412" width="315" height="34" rx="8" fill="#FFFFFF" stroke="#1A2332" stroke-width="1.3"/>
  <text x="442" y="434" font-size="11.5" fill="#1A2332" text-anchor="middle">RoPE(q), RoPE(k) at pos · θ per head-pair</text>
  <path d="M690,388 V478" stroke="#1A2332" stroke-width="1.8" marker-end="url(#ai6)"/>
  <path d="M442,446 V478" stroke="#1A2332" stroke-width="1.8" marker-end="url(#ai6)"/>

  <rect x="285" y="482" width="480" height="34" rx="8" fill="#E7F4F0" stroke="#0E7C66" stroke-width="1.4"/>
  <text x="525" y="504" font-size="11.5" fill="#0B4F41" text-anchor="middle">append k, v → KV cache [layer][pos][dim]   (in RAM, per generation)</text>
  <path d="M525,516 V536" stroke="#1A2332" stroke-width="2" marker-end="url(#ai6)"/>

  <rect x="285" y="540" width="480" height="34" rx="8" fill="#FFFFFF" stroke="#1A2332" stroke-width="1.3"/>
  <text x="525" y="562" font-size="11.5" fill="#1A2332" text-anchor="middle">causal attention: softmax( q·kₜ / √hd ), t ≤ pos → Σ pₜ·vₜ  per head</text>
  <path d="M525,574 V594" stroke="#1A2332" stroke-width="2" marker-end="url(#ai6)"/>

  <rect x="400" y="598" width="250" height="34" rx="8" fill="#FFFFFF" stroke="#1A2332" stroke-width="1.3"/>
  <text x="525" y="620" font-size="11.5" fill="#1A2332" text-anchor="middle">wo · matvec  →  x += result</text>
  <path d="M525,632 V652" stroke="#1A2332" stroke-width="2" marker-end="url(#ai6)"/>

  <rect x="400" y="656" width="250" height="34" rx="8" fill="#FFFFFF" stroke="#1A2332" stroke-width="1.3"/>
  <text x="525" y="678" font-size="11.5" fill="#1A2332" text-anchor="middle">RMSNorm (ffn_norm, eps)</text>
  <path d="M525,690 V710" stroke="#1A2332" stroke-width="2" marker-end="url(#ai6)"/>

  <rect x="330" y="714" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#1A2332" stroke-width="1.3"/>
  <text x="420" y="736" font-size="11.5" fill="#1A2332" text-anchor="middle">w1 · matvec (ffn)</text>
  <rect x="540" y="714" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#1A2332" stroke-width="1.3"/>
  <text x="630" y="736" font-size="11.5" fill="#1A2332" text-anchor="middle">w3 · matvec (ffn)</text>
  <path d="M420,748 V764 H505" stroke="#1A2332" stroke-width="1.8" fill="none"/>
  <path d="M630,748 V764 H545" stroke="#1A2332" stroke-width="1.8" fill="none"/>
  <rect x="360" y="768" width="330" height="34" rx="8" fill="#FFFFFF" stroke="#1A2332" stroke-width="1.3"/>
  <text x="525" y="790" font-size="11.5" fill="#1A2332" text-anchor="middle">SiLU(h1) ⊙ h3 → w2 · matvec → x += result</text>

  <!-- after layers -->
  <path d="M525,810 V832" stroke="#1A2332" stroke-width="2" marker-end="url(#ai6)"/>
  <rect x="400" y="836" width="250" height="34" rx="8" fill="#FFFFFF" stroke="#1A2332" stroke-width="1.4"/>
  <text x="525" y="858" font-size="11.5" fill="#1A2332" text-anchor="middle">RMSNorm (out_norm)</text>
  <path d="M525,870 V890" stroke="#1A2332" stroke-width="2" marker-end="url(#ai6)"/>
  <rect x="400" y="894" width="250" height="34" rx="8" fill="#FFFFFF" stroke="#1A2332" stroke-width="1.4"/>
  <text x="525" y="916" font-size="11.5" fill="#1A2332" text-anchor="middle">lm_head · matvec → logits[vocab]</text>
  <path d="M525,928 V948" stroke="#1A2332" stroke-width="2" marker-end="url(#ai6)"/>
  <rect x="330" y="952" width="390" height="52" rx="10" fill="#FFF8EA" stroke="#B07E23" stroke-width="1.6"/>
  <text x="525" y="974" font-size="11.5" font-weight="700" fill="#7A5716" text-anchor="middle">SAMPLE — greedy: argmax (first max)</text>
  <text x="525" y="993" font-size="10.5" fill="#8A6E2F" text-anchor="middle">top-k: splitmix64(seed) — the only randomness in the machine</text>
  <path d="M720,978 H860 V161 H656" stroke="#0E7C66" stroke-width="1.8" stroke-dasharray="7 5" fill="none" marker-end="url(#at6)"/>
  <text x="875" y="560" font-size="10.5" fill="#4A7A6D" transform="rotate(-90 875 560)" text-anchor="middle">emitted token feeds the next step · pos + 1</text>

  <!-- side notes -->
  <text x="60" y="380" font-size="10.5" fill="#4A7A6D">matvec order defined:</text>
  <text x="60" y="396" font-size="10.5" fill="#4A7A6D">i ascending, fp32 acc</text>
  <text x="60" y="560" font-size="10.5" fill="#4A7A6D">softmax: subtract max,</text>
  <text x="60" y="576" font-size="10.5" fill="#4A7A6D">expf, normalize — fp32</text>
  <text x="60" y="740" font-size="10.5" fill="#4A7A6D">every box mirrored in</text>
  <text x="60" y="756" font-size="10.5" fill="#4A7A6D">tools/oracle.py —</text>
  <text x="60" y="772" font-size="10.5" fill="#4A7A6D">token-exact ×16 in CI</text>
  <text x="60" y="1044" font-size="12" fill="#3A4450">Two bars, never confused: oracle bar (this math is the model) · determinism bar (same inputs, same tokens, bit-exact).</text>
</svg>
